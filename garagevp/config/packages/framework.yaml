framework:
   # Clé secrète globale
   secret: '%env(APP_SECRET)%'
   
   # Protection CSRF
   csrf_protection: true
   
   # Config sessions
   session:
       enabled: true
       storage_factory_id: session.storage.factory.native   # Stockage natif
       cookie_secure: auto                                  # HTTPS si dispo
       cookie_samesite: 'lax'                              # Anti-CSRF
       cookie_httponly: true                               # Anti-XSS


   #  Proxies et hôtes de confiance pour HTTPS / proxy inverse comme Render 

   trusted_proxies: '%env(TRUSTED_PROXIES)%'
   trusted_hosts: '%env(TRUSTED_HOSTS)%'
   
   esi: false
   fragments: false
   
   validation:
       enable_attributes: true

when@test:
   framework:
       test: true
       session:
           storage_factory_id: session.storage.factory.mock_file
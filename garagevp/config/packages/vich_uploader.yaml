vich_uploader:
    db_driver: orm
    mappings:
        service_images:                                          # Nom du mapping utilisé dans l'entité Service
            uri_prefix: /uploads/services                        # Préfixe URL pour accéder aux images
            upload_destination: '%kernel.project_dir%/public/uploads/services'    # Dossier de destination
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer  # Nommage automatique des fichiers

server {
    listen 80;
    listen [::]:80;
    server_name garagevp.local localhost;
    
    root /var/www/html/public;
    index index.php index.html;

    # Logs détaillés
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # Paramètres FastCGI précis
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Paramètres supplémentaires
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        # Configuration des buffers et timeout
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 300;

        # Gestion des erreurs
        fastcgi_intercept_errors on;
        error_log /var/log/nginx/fastcgi_debug.log debug;
    }

    # Sécurité - bloquer l'accès aux autres fichiers PHP
    location ~ \.php$ {
        return 404;
    }

    # Compression et optimisation
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}

# Configuration HTTPS (identique à la configuration HTTP)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name garagevp.local localhost;

    # Configuration SSL
    ssl_certificate /etc/ssl/private/localhost.crt;
    ssl_certificate_key /etc/ssl/private/localhost.key;
    ssl_verify_client off;
    ssl_verify_depth 0;

    # Reste de la configuration identique au bloc HTTP
    root /var/www/html/public;
    index index.php index.html;

    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 300;

        fastcgi_intercept_errors on;
        error_log /var/log/nginx/fastcgi_debug.log debug;
    }

    location ~ \.php$ {
        return 404;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Support des lecteurs d'écran
    add_header Content-Type "text/html; charset=UTF-8";
}







